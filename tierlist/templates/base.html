<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script>
        (function () {
            var theme = localStorage.getItem('tierier-theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'tierlist/style.css' %}">

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <!-- Load Sortable.js and HTMX from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.7/Sortable.min.js" integrity="sha512-ri8dokds012Oxz+iFzMs4KNJXVc+h7J1zq6unM1NTtzBLj4jD1R5BWiK6QycK0TdSdkt7zYcIcv6sUPhmYkbdQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <nav class="site-nav" aria-label="Account navigation">
        <a class="site-brand" href="{% url 'tierlist:index' %}">Tierier</a>
        <div class="account-links">
            <button class="button button-small button-quiet" type="button" id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">Dark mode</button>
            {% if user.is_authenticated %}
                <span class="mono">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="button button-small button-quiet" type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'tierlist:register' %}">Register</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
    <script>

        function makeTableSortable(elt){
            if (!elt || elt.dataset.sortableInitialized === 'true') return;

            Sortable.create(elt, {
                animation: 150,
                filter: 'input, button, form',
                preventOnFilter: false,
                group: {
                    name: 'tierlist-choices',
                    pull: 'clone',
                    put: Boolean(elt.dataset.categoryId)
                },
                onEnd: function (event) {
                    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                    var formData = new FormData();
                    var targetCategoryId = event.to.dataset.categoryId;

                    var duplicate = Array.from(event.to.querySelectorAll('[data-choice-id]'))
                        .find(function (item) {
                            return item !== event.item && item.dataset.choiceId === event.item.dataset.choiceId;
                        });
                    if (duplicate) {
                        event.item.remove();
                        return;
                    }

                    if (targetCategoryId) {
                        var actionForm = event.item.querySelector('[data-choice-action-form]');
                        actionForm.action = event.to.dataset.removeUrlTemplate.replace(
                            '/0/remove/',
                            '/' + event.item.dataset.choiceId + '/remove/'
                        );
                        // actionForm.querySelector('button').textContent = '';
                    }

                    formData.append('category_id', targetCategoryId);
                    var items = Array.from(event.to.querySelectorAll('[data-choice-id]'));
                    if (!targetCategoryId) items.reverse();
                    items.forEach(function (item) {
                        formData.append('item_id', item.dataset.choiceId);
                    });

                    fetch('{% url "tierlist:update_order" %}', {
                        method: 'POST',
                        headers: {'X-CSRFToken': csrfToken},
                        body: formData
                    }).then(function (response) {
                        if (response.ok) {
                            var categoryScroll = document.querySelector('.category-scroll');
                            if (categoryScroll) {
                                sessionStorage.setItem('category-scroll-left', categoryScroll.scrollLeft);
                            }
                            window.location.reload();
                        }
                    });
                }
            });

            elt.dataset.sortableInitialized = 'true';
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.sortable-list').forEach(makeTableSortable);
        });

        document.addEventListener('htmx:load', function(evt){
            document.querySelectorAll('.sortable-list').forEach(makeTableSortable);
        })

        document.querySelectorAll('.category-edit-form input').forEach(function (field) {
            field.addEventListener('blur', function () {
                var form = field.form;
                fetch(form.action, {
                    method: 'POST',
                    headers: {'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value},
                    body: new FormData(form)
                }).then(function (response) {
                    if (response.ok) window.location.reload();
                });
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            var themeToggle = document.getElementById('theme-toggle');
            var colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
            var updateThemeToggle = function () {
                var theme = document.documentElement.dataset.theme || (colorScheme.matches ? 'dark' : 'light');
                var isDark = theme === 'dark';
                themeToggle.setAttribute('aria-pressed', String(isDark));
                themeToggle.textContent = isDark ? 'Dark mode on' : 'Dark mode';
            };
            updateThemeToggle();
            themeToggle.addEventListener('click', function () {
                var theme = document.documentElement.dataset.theme || (colorScheme.matches ? 'dark' : 'light');
                var nextTheme = theme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = nextTheme;
                localStorage.setItem('tierier-theme', nextTheme);
                updateThemeToggle();
            });
            colorScheme.addEventListener('change', updateThemeToggle);

            var choiceInput = document.querySelector('#add-choice-form input[name="name"]');
            var choiceForm = document.getElementById('add-choice-form');
            var CategoryInput = document.querySelector('#add-category-form input[name="name"]');
            var categoryForm = document.getElementById('add-category-form');
            var paletteDialog = document.getElementById('palette-dialog');
            var openPaletteDialog = document.getElementById('open-palette-dialog');
            if (paletteDialog && openPaletteDialog) {
                openPaletteDialog.addEventListener('click', function () {
                    paletteDialog.showModal();
                });
                paletteDialog.querySelectorAll('form[action*="palette/update"]').forEach(function (form) {
                    form.addEventListener('submit', function () {
                        sessionStorage.setItem('reopen-palette-dialog', 'true');
                    });
                });
                if (sessionStorage.getItem('reopen-palette-dialog') === 'true') {
                    sessionStorage.removeItem('reopen-palette-dialog');
                    paletteDialog.showModal();
                }
            }
            if (choiceInput && sessionStorage.getItem('focus-choice-input') === 'true') {
                sessionStorage.removeItem('focus-choice-input');
                choiceInput.focus();
            }
            if (choiceForm) {
                choiceForm.addEventListener('submit', function () {
                    sessionStorage.setItem('focus-choice-input', 'true');
                });
            }
            if (CategoryInput && sessionStorage.getItem('focus-category-input') === 'true') {
                sessionStorage.removeItem('focus-category-input');
                CategoryInput.focus();
            }
            if (categoryForm) {
                categoryForm.addEventListener('submit', function () {
                    sessionStorage.setItem('focus-category-input', 'true');
                });
            }

            var categoryScroll = document.querySelector('.category-scroll');
            if (!categoryScroll) return;
            var categoriesPanel = categoryScroll.closest('.categories-panel');
            // var updateOverflowShadow = function () {
            //     categoriesPanel.classList.toggle(
            //         'has-right-overflow',
            //         categoryScroll.scrollLeft + categoryScroll.clientWidth < categoryScroll.scrollWidth - 1
            //     );
            // };
            var savedScroll = sessionStorage.getItem('category-scroll-left');
            if (savedScroll !== null) {
                categoryScroll.scrollLeft = Number(savedScroll);
                sessionStorage.removeItem('category-scroll-left');
            }
            // updateOverflowShadow();
            // categoryScroll.addEventListener('scroll', updateOverflowShadow);
            // window.addEventListener('resize', updateOverflowShadow);
        });
    </script>
    <footer>
        
    </footer>
</body>
</html>
