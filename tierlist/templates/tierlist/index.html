{% extends 'base.html' %}

{% block content %}
<h1>This is the Tierlist page</h1>
<div>
    <div name="main-area">
        <!-- left column; choice list -->
         <form id="add-choice-form" method="post" action="{% url 'tierlist:add_choice' %}">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Enter choice name" required>
            <button type="submit">Add Choice</button>
        </form>
        <form id="choice-form" hx-post="{% url 'tierlist:update_order' %}" hx-trigger="end" hx-swap="none">
            {% csrf_token %}
            <div id="items-list">
                {% for choice in choicelist %}
                    <div class="sortable-item" style="padding:10px; margin:5px; background:#f4f4f4; cursor:grab;">
                        <input type="hidden" name="item_id" value="{{ choice.id }}">
                        <span>☰ {{ choice.name }}</span>
                    </div>
                {% endfor %}
            </div>
        </form>

        <!-- center column; category lists -->
        <div name="categories">

        </div>

        <!-- right column; add category button -->

    </div>

    <!-- bottom; ranking view -->
    <ol name="rankings">

    </ol>
</div>
{% endblock %}
